  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>AirPlain · AI routes plus AI notes</title>\n<meta name=\"description\" content=\"AI routes plus AI notes. AirPlain reads your customer messages, sends each one where it belongs, and writes down every decision in plain English.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* latin */\n@font-face {\n  font-family: 'Share Tech Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"13590e56-6723-4f75-ac71-4ddfd5ac91e0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n</style>\n<style>\n:root{\n  --bg:#eef0f3;--card:#fff;--soft:#f5f6f8;--line:#e3e6ea;\n  --ink:#16171a;--ink-2:#55595f;--ink-3:#8b9097;\n  --yellow:#ffd60a;--yellow-2:#fff4b8;--yellow-3:#fffbe3;--dark:#16171a;--red:#c2352a;--green:#2fbf71;\n  --stock:#fbfaf4;--rule:#dcd8c6;\n  --sans:system-ui,-apple-system,\"Segoe UI\",Helvetica,sans-serif;\n  --print:\"Share Tech Mono\",ui-monospace,Menlo,Consolas,monospace;\n  --r:24px;--shadow:0 1px 2px rgba(22,23,26,.04),0 12px 32px -12px rgba(22,23,26,.14);\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{scroll-behavior:smooth;scroll-padding-top:80px}\nbody{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}\na{color:var(--ink);text-underline-offset:3px}\na:hover{color:var(--ink-2)}\n.wrap{width:100%;max-width:1160px;margin:0 auto;padding:0 18px}\nsvg.i{width:1em;height:1em;fill:currentColor;flex:none}\n.print{font-family:var(--print);text-transform:uppercase}\n\n/* buttons */\n.pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--yellow);color:var(--ink);font-family:var(--sans);font-weight:700;font-size:17px;border:0;border-radius:999px;padding:0 30px;min-height:56px;text-decoration:none;cursor:pointer;transition:transform .12s,background .12s;width:100%}\n.pill:hover{color:var(--ink);background:#ffcc00}\n.pill:active{transform:scale(.98)}\n.pill:focus-visible{outline:3px solid var(--ink);outline-offset:3px}\n.pill:disabled{opacity:.6;cursor:default}\n.pill.dark{background:var(--dark);color:#fff}\n.pill.dark:hover{background:#000;color:#fff}\n.pill.sm{min-height:44px;font-size:15px;padding:0 18px;width:auto}\n\n/* header */\nheader{position:sticky;top:0;z-index:20;background:rgba(238,240,243,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}\n.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px;max-width:1160px;margin:0 auto}\n.hdr-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;background:var(--card);border-radius:999px;padding:6px 6px 6px 8px;box-shadow:var(--shadow)}\n.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}\n.logo-mark{width:36px;height:36px;border-radius:50%;background:var(--dark);color:var(--yellow);display:grid;place-items:center;font-size:17px}\n.logo-mark svg{transform:rotate(45deg)}\n.logo-word{font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1}.wm{font-family:system-ui,-apple-system,\"Segoe UI\",Helvetica,sans-serif;font-weight:900;letter-spacing:-.04em;line-height:1;color:#16171a;white-space:nowrap}.wm .ai{color:#ffd60a}.wm .sl{color:#8c8f99;font-weight:400}.wm-def{font-size:clamp(40px,10vw,64px)}.wm-hdr{font-size:19px;font-weight:800;letter-spacing:-.02em}.wm-foot{font-size:30px;font-weight:800;color:#fff}.wm-ld{font-size:38px}.wm-dec{display:block;font-family:\"Share Tech Mono\",ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#8b9097; 18v3h3v-3h10v3h3v-6H4zm15-8h3v3h-3zM2 10h3v3H2zm15 3H7V5a2 2 0 012-2h6a2 2 0 012 2z\"></path></symbol>\n  <symbol id=\"land\" viewBox=\"0 0 24 24\"><path d=\"M2.5 19h19v2h-19zm7.18-5.73l4.35 1.16 5.31 1.42c.8.21 1.62-.26 1.84-1.06.21-.8-.26-1.62-1.06-1.84l-5.31-1.42-2.76-9.02L10.12 2v8.28L5.15 8.95l-.93-2.32-1.45-.39v5.17l1.6.43 5.31 1.43z\"></path></symbol>\n  <symbol id=\"takeoff\" viewBox=\"0 0 24 24\"><path d=\"M2.5 19h19v2h-19zm19.57-9.36c-.21-.8-1.04-1.28-1.84-1.06L14.92 10l-6.9-6.43-1.93.51 4.14 7.17-4.97 1.33-1.97-1.54-1.45.39 2.59 4.49L21 11.49c.81-.23 1.28-1.05 1.07-1.85z\"></path></symbol>\n</svg>\n\n<header>\n  <div class=\"hdr\">\n    <div class=\"hdr-bar\">\n      <a class=\"logo\" href=\"#top\" aria-label=\"AirPlain home\"><span class=\"wm wm-hdr\"><span class=\"ai\">ai</span>r<span class=\"sl\">/</span>Pl<span class=\"ai\">ai</span>n</span><span class=\"logo-code\">AP25</span></a>\n      <nav class=\"nav\" aria-label=\"Main\"><a href=\"#plan\">Flight plan</a><a href=\"#receipts\">In-flight receipts</a><a href=\"#board\">Arrivals</a><a href=\"#fares\">Fares</a><a href=\"#faq\">Flight info</a></nav>\n      <a class=\"pill sm\" href=\"#signup\">Book your seat</a>\n    </div>\n  </div>\n</header>\n\n<main id=\"top\">\n  <section class=\"hero\">\n    <div class=\"wrap hero-grid\">\n      <div class=\"hero-copy\">\n        <span class=\"chip\"><span class=\"dot\"></span>AIRPLAIN · FLIGHT AP25 · NOW BOARDING</span>\n        <h1><span class=\"hl\">AI routes plus AI notes.</span> AirPlain reads your customer messages, sends each one where it belongs, and writes down every decision in plain English.</h1>\n        <a class=\"pill\" href=\"#signup\">Book your seat <svg class=\"i\"><use href=\"#plane\"></use></svg></a>\n        <div class=\"sub\"><span>ADMIT ONE</span><span>FROM $150/MONTH</span><span>CANCEL ANYTIME</span></div>\n      </div>\n      <div class=\"ticket\">\n        <div class=\"board-label\" aria-hidden=\"true\"><span>DEPARTURES</span><b>● LIVE</b></div>\n        <div class=\"board\" id=\"flap\" role=\"img\" aria-label=\"Departure board: MESSAGES SORTED. FLIGHT AP25 NOW BOARDING. 3 SEATS LEFT.\"></div>\n        <div class=\"t-split\" aria-hidden=\"true\"></div>\n        <div class=\"t-meta\">\n          <div><div class=\"lbl\">Flight</div><div class=\"val\">AP25</div></div>\n          <div><div class=\"lbl\">Gate</div><div class=\"val\">P1</div></div>\n          <div><div class=\"lbl\">Seats</div><div class=\"val y\">3 LEFT</div></div>\n        </div>\n      </div>\n    </div>\n  </section>\n  <section id=\"name\">\n    <div class=\"wrap\">\n      <div class=\"card def\">\n        <div class=\"def-word\"><span class=\"wm wm-def\"><span class=\"ai\">ai</span>r<span class=\"sl\">/</span>Pl<span class=\"ai\">ai</span>n</span><span class=\"def-pos\">(noun and verb).</span></div>\n<div class=\"wm-dec wm-dec-def\">AI routes plus AI notes</div>\n        <hr class=\"def-div\">\n<div class=\"def-label\">Noun</div>\n<ol class=\"def-list\">\n          <li><span class=\"def-n\">1</span><p><strong>AI routes.</strong> Every message sent where it belongs: answer now, book a time, flag for you, or file away.</p></li>\n          <li><span class=\"def-n\">2</span><p><strong>AI notes.</strong> A plain-English note for every decision, so you always know what happened and why.</p></li>\n        </ol>\n<hr class=\"def-div\">\n<div class=\"def-label\">Verb</div>\n<ol class=\"def-list\">\n<li><span class=\"def-n\">3</span><div><p>To sort and route customer messages where they belong, then document every decision in plain English.</p><p class=\"def-ex\">AirPlain your inbox.</p></div></li>\n</ol>\n      </div>\n    </div>\n  </section>\n\n\n  <section class=\"sec\" id=\"plan\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\">\n        <div><div class=\"eyebrow\">Flight plan</div><h2>Flight plan</h2></div>\n        <p class=\"lede\">Every message routed. Every decision noted. Please review before takeoff.</p>\n      </div>\n      <div class=\"card safety\">\n        <div class=\"sf-head\"><span class=\"t\">Safety instructions</span><span class=\"print\">FLIGHT AP25 · PLEASE READ BEFORE TAKEOFF</span></div>\n        <div class=\"sf-panels\">\n          <div class=\"sf-panel\">\n            <div class=\"vid\" data-src=\"videos/safety-1.mp4\"><video playsinline controls preload=\"metadata\" aria-label=\"Safety demonstration 1: Connect your messages\"></video>\n              <div class=\"vph\" aria-hidden=\"true\"><div class=\"vph-top\"><span>SAFETY DEMO</span><span>1/3</span></div><div class=\"vph-mid\"><span class=\"vph-play\"></span></div><div class=\"vph-cap\">Welcome aboard Flight AP25. Please make sure your messages are linked. You will find instructions on page three of the pamphlet.</div></div></div>\n            <h3>Connect your messages.</h3>\n            <p>Link the email, texts, or DMs where customers reach you. It takes about ten minutes.</p>\n          </div>\n          <div class=\"sf-panel\">\n            <div class=\"vid\" data-src=\"videos/safety-2.mp4\"><video playsinline controls preload=\"metadata\" aria-label=\"Safety demonstration 2: AirPlain sorts\"></video>\n              <div class=\"vph\" aria-hidden=\"true\"><div class=\"vph-top\"><span>SAFETY DEMO</span><span>2/3</span></div><div class=\"vph-mid\"><span class=\"vph-play\"></span></div><div class=\"vph-cap\">AirPlain will now sort your messages. In the unlikely event of a confusing decision, your paper trail is located under your seat.</div></div></div>\n            <h3>AirPlain sorts.</h3>\n            <span class=\"ai-tag\">AI routes</span>\n            <p>Every new message gets read and sent where it belongs: answer now, book a time, flag for you, or file away.</p>\n          </div>\n          <div class=\"sf-panel\">\n            <div class=\"vid\" data-src=\"videos/safety-3.mp4\"><video playsinline controls preload=\"metadata\" aria-label=\"Safety demonstration 3: Every decision recorded\"></video>\n              <div class=\"vph\" aria-hidden=\"true\"><div class=\"vph-top\"><span>SAFETY DEMO</span><span>3/3</span></div><div class=\"vph-mid\"><span class=\"vph-play\"></span></div><div class=\"vph-cap\">Every decision is recorded in your AirPlain itinerary. And remember, you may exit at any time. Thank you for flying AirPlain.</div></div></div>\n            <h3>A note for every decision.</h3>\n            <span class=\"ai-tag\">AI notes</span>\n            <p>For each message, AirPlain writes a short note saying what it did and why. You can read them any time.</p>\n          </div>\n        </div>\n        <div class=\"sf-foot\"><span class=\"seat-ic\" aria-hidden=\"true\"><svg class=\"i\"><use href=\"#seat\"/></svg></span><p>In the unlikely event of a confusing decision, your paper trail is located under your seat.</p></div>\n        <div class=\"sf-fine\"><span>SEAT POCKET CARD · AP25</span><span>DO NOT REMOVE FROM AIRCRAFT</span></div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"sec\" id=\"receipts\">\n    <div class=\"wrap split\">\n      <div>\n        <div class=\"eyebrow\">Baggage tracking</div>\n        <h2 style=\"margin:10px 0 14px\">No bags lost.</h2>\n        <p class=\"lede\">Every message gets tagged and tracked like luggage. The note AirPlain writes is your baggage claim check, so you never have to guess what happened to a message.</p>\n        <ol class=\"track\" aria-label=\"Tracking for message 000418\">\n          <li><span class=\"st\">Checked in<small>Dana's email arrives</small></span><span class=\"tm\">09:41</span></li>\n          <li><span class=\"st\">Tagged<small>Reschedule request</small></span><span class=\"tm\">09:41</span></li>\n          <li><span class=\"st\">Delivered<small>Sent to Booking with two open times</small></span><span class=\"tm\">09:42</span></li>\n          <li><span class=\"st\">Claim check filed<small>Plain-English note saved</small></span><span class=\"tm\">09:42</span></li>\n        </ol>\n      </div>\n      <div class=\"card receipt\" aria-label=\"Sample baggage claim check\">\n        <div class=\"r-head\"><span class=\"t\">Baggage claim check</span><span class=\"no\">TAG 000418</span></div>\n        <div class=\"r-route\">\n          <div><div class=\"lbl\">From</div><div class=\"val\">Dana R.</div><div class=\"lbl\">Email</div></div>\n          <div class=\"mid\" aria-hidden=\"true\"><svg class=\"i\"><use href=\"#plane\"></use></svg></div>\n          <div class=\"r\"><div class=\"lbl\">Routed to</div><div class=\"val\">Booking</div><div class=\"lbl\">10/13 09:42 AM</div></div>\n        </div>\n        <div class=\"notch\"></div>\n        <div class=\"r-grid\">\n          <div><div class=\"lbl\">Asked</div><div class=\"val\">Move my Thursday appt?</div></div>\n          <div><div class=\"lbl\">Decision</div><div class=\"val\">Reschedule request</div></div>\n          <div><div class=\"lbl\">Flight</div><div class=\"val\">AP25</div></div>\n          <div><div class=\"lbl\">Needs you</div><div class=\"val\">No</div></div>\n        </div>\n        <div class=\"notch\"></div>\n        <p class=\"r-note\"><span class=\"lbl\">Note</span>Dana asked to move her Thursday 2pm. I offered Friday at 10am and 2pm, the two open slots. Nothing is booked until she picks one.</p>\n        <div class=\"r-foot\">\n          <div class=\"stamp\" aria-hidden=\"true\">ON FILE</div>\n          <div class=\"barcode\" aria-hidden=\"true\"></div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"sec\" id=\"board\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\">\n        <div><div class=\"eyebrow\">Arrivals &amp; departures</div><h2>What's landing in AI this week</h2></div>\n        <p class=\"lede\">Arrivals are new AI tools landing. Departures are old ways of working being retired. Every flight comes translated into plain English.</p>\n      </div>\n      <div class=\"news\">\n        <div class=\"fids\">\n          <div class=\"fids-top\">\n            <div class=\"tabs\" role=\"tablist\" aria-label=\"Board\">\n              <button role=\"tab\" id=\"tab-arr\" aria-selected=\"true\" aria-controls=\"fids-list\"><svg class=\"i\"><use href=\"#land\"></use></svg>Arrivals</button>\n              <button role=\"tab\" id=\"tab-dep\" aria-selected=\"false\" aria-controls=\"fids-list\"><svg class=\"i\"><use href=\"#takeoff\"></use></svg>Departures</button>\n            </div>\n            <span class=\"clock\">LOCAL TIME <b id=\"clock\">--:--</b></span>\n          </div>\n          <div class=\"fids-cols\" aria-hidden=\"true\"><span>FLIGHT</span><span id=\"col-item\">ARRIVING</span><span>STATUS</span></div>\n          <ul class=\"fids-list\" id=\"fids-list\" role=\"tabpanel\" aria-labelledby=\"tab-arr\"></ul>\n          <div class=\"fids-foot\"><span>BOARD UPDATED WEEKLY</span><span>ALL TIMES PLAIN ENGLISH</span></div>\n        </div>\n        <aside class=\"card mag\" aria-label=\"In-flight magazine\">\n          <div class=\"mag-cover\">\n            <div class=\"issue\"><span>IN-FLIGHT MAGAZINE</span><span>ISSUE 01</span></div>\n            <div class=\"title\">Cruising Altitude</div>\n            <div class=\"tag\">Plain-English AI news, served at cruising altitude.</div>\n            <span class=\"alt\" aria-hidden=\"true\">35,000 FT</span>\n          </div>\n          <div class=\"mag-body\">\n            <ul>\n              <li><span>P.04</span>Every flight on the board, explained in full</li>\n              <li><span>P.09</span>What to try this week, and what to skip</li>\n              <li><span>P.12</span>Notes from the first flight</li>\n            </ul>\n            <a class=\"pill dark\" href=\"#magazine\" style=\"width:100%\">Read the latest issue</a>\n          </div>\n        </aside>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"sec\" id=\"fares\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\">\n        <div><div class=\"eyebrow\">Fares</div><h2>Three fares.</h2></div>\n        <p class=\"lede\">No add-ons, no contract.</p>\n      </div>\n      <div class=\"fx\">\n        <div class=\"fx-grid\">\n          <div class=\"fx-col fx-left\" style=\"order:0\">\n            <div class=\"fx-h info\"><span>Flight AP25</span><span>3 fares</span></div>\n            <div class=\"fx-info\">\n              <div class=\"fx-codes\"><span>NOISE</span><span>NOTES</span><span>Nonstop</span></div>\n              <div class=\"fx-route\"><b>NOISE</b><svg class=\"i\" aria-hidden=\"true\"><use href=\"#arrow\"/></svg><b>NOTES</b></div>\n              <div class=\"fx-op\"><svg class=\"i\" aria-hidden=\"true\" style=\"transform:rotate(45deg)\"><use href=\"#plane\"/></svg>AP25 · AirPlain</div>\n              <div class=\"fx-links\"><a href=\"#faq\">Flight info</a></div>\n            </div>\n          </div>\n          <div class=\"fx-col\" style=\"order:1\">\n            <div class=\"fx-h e\"><span>Economy</span></div>\n            <button class=\"fx-cell\" type=\"button\" data-tier=\"economy\" aria-expanded=\"false\" aria-controls=\"fx-detail\"><span class=\"fx-price\"><b>$150</b> /month</span><span class=\"fx-desc\">One channel. AirPlain sorts, you approve.</span><span class=\"fx-chev\" aria-hidden=\"true\"></span></button>\n          </div>\n          <div class=\"fx-col\" style=\"order:3\">\n            <div class=\"fx-h b\"><span>Business</span><span class=\"fx-badge\">First flight · 3 seats</span></div>\n            <button class=\"fx-cell\" type=\"button\" data-tier=\"business\" aria-expanded=\"true\" aria-controls=\"fx-detail\"><span class=\"fx-price\"><b>$300</b> /month</span><span class=\"fx-desc\">This is our first flight. Three businesses, three seats. Cancel anytime.</span><span class=\"fx-chev\" aria-hidden=\"true\"></span></button>\n          </div>\n          <div class=\"fx-col\" style=\"order:5\">\n            <div class=\"fx-h f\"><span>First class</span></div>\n            <button class=\"fx-cell\" type=\"button\" data-tier=\"first\" aria-expanded=\"false\" aria-controls=\"fx-detail\"><span class=\"fx-price\"><b>$600</b> /month</span><span class=\"fx-desc\">White glove. Built with you.</span><span class=\"fx-chev\" aria-hidden=\"true\"></span></button>\n          </div>\n          <div class=\"fx-detail\" id=\"fx-detail\" style=\"--o:4\">\n            <div class=\"fx-d-top\"><h3>Select one of these fares</h3><button class=\"fx-x\" id=\"fx-close\" type=\"button\" aria-label=\"Close fares\">×</button></div>\n            <div class=\"fx-cards\" id=\"fx-cards\"></div>\n          </div>\n        </div>\n      </div>\n      <div class=\"card fx-seats\" id=\"seatmap\">\n        <div class=\"fx-seats-copy\">\n          <p class=\"val\" style=\"font-size:24px;line-height:1.2;letter-spacing:-.01em\">3 seats left. When they're gone, the flight is full.</p>\n          <p class=\"fine-print\">No setup fee. No contract. If it's not saving you time by month two, we'll tell you ourselves.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"sec\" id=\"customs\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\">\n        <div><div class=\"eyebrow\">Customs</div><h2>Your data, declared</h2></div>\n        <p class=\"lede\">What AirPlain does with your customer messages, filled in and signed.</p>\n      </div>\n      <div class=\"customs\">\n        <div class=\"cu-head\">\n          <div><div class=\"t\">Customs declaration</div><div class=\"print\">AIRPLAIN · FLIGHT AP25 · NOISE TO NOTES</div></div>\n          <div class=\"form\">FORM AP-30<br>ONE PER BUSINESS</div>\n        </div>\n        <div class=\"cu-q\">\n          <div class=\"big\">Anything to declare?</div>\n          <div class=\"ans\">Nothing sold. Message text dropped after 30 days.</div>\n        </div>\n        <ul class=\"cu-rows\">\n          <li><span class=\"n\">01</span><span class=\"q\">Do we sell your data?<small>Not to advertisers, not to anyone.</small></span><span class=\"yn\"><span><i></i>YES</span><span><i class=\"x\"></i>NO</span></span></li>\n          <li><span class=\"n\">02</span><span class=\"q\">Do we keep message text after 30 days?<small>The text is dropped. Your decision notes stay.</small></span><span class=\"yn\"><span><i></i>YES</span><span><i class=\"x\"></i>NO</span></span></li>\n          <li><span class=\"n\">03</span><span class=\"q\">Do your messages stay yours?<small>You can export or delete them any time.</small></span><span class=\"yn\"><span><i class=\"x\"></i>YES</span><span><i></i>NO</span></span></li>\n        </ul>\n        <div class=\"cu-sign\">\n          <div><div class=\"line\">AirPlain</div><div class=\"lbl\">Signature of declarant</div></div>\n          <div><div class=\"line\" style=\"font-family:var(--print);font-style:normal;font-size:18px\" id=\"cu-date\">13 OCT 2026</div><div class=\"lbl\">Date</div></div>\n          <div class=\"cu-stamp\" aria-hidden=\"true\">CLEARED<br>AP25</div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"sec\" id=\"faq\">\n    <div class=\"wrap faq-grid\">\n      <div class=\"sec-head\">\n        <div><div class=\"eyebrow\">Flight info</div><h2>Flight info</h2></div>\n        <p class=\"lede\">Questions we hear before takeoff.</p>\n      </div>\n      <div class=\"faq\">\n        <details><summary><span>Do I need to be technical?</span><span class=\"pm\" aria-hidden=\"true\"></span></summary><p class=\"a\">No. If you can read a text message, you can run AirPlain. NaLonni walks you through setup on a call.</p></details>\n        <details><summary><span>What if AirPlain gets one wrong?</span><span class=\"pm\" aria-hidden=\"true\"></span></summary><p class=\"a\">Every decision has a note, so you can see exactly what happened. Tell us what it should have done and it learns from that.</p></details>\n        <details><summary><span>Does it reply to customers on its own?</span><span class=\"pm\" aria-hidden=\"true\"></span></summary><p class=\"a\">Only if you want it to. You can
